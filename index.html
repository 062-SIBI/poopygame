<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Poopy — Idle Poop Collector</title>
<meta name="description" content="Combine feeds, hatch poops, and fill your Poopdex. A cute idle collection game.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6B4423">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poopy">
<meta property="og:title" content="Poopy — Idle Poop Collector">
<meta property="og:description" content="Combine feeds, hatch poops, and fill your Poopdex.">
<!-- BUILD:OG — build.sh가 도메인 인자를 받으면 절대 URL로 치환한다.
     OG 크롤러는 상대 경로를 못 따라가고 JS도 실행하지 않으므로 절대 URL이어야 한다. -->
<meta property="og:image" content="https://poopygame.com/assets/icon/icon-512.png">
<meta property="og:url" content="https://poopygame.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<!-- 애드센스 소유권 확인 스니펫 (pub-7085369509523116, 2026-08-19 발급).
     심사 통과 전에는 광고가 안 나온다 — 이 줄은 "이 사이트가 내 것"임을 증명하는 용도다. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7085369509523116" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
 href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --ink:#3A2B1C; --dim:#8E7F6D; --line:#E3D3BE; --paper:#FFFBF5;
  --brown:#8B5A2B; --brownD:#4E3216;
  --gA:#7CC24A; --gB:#4E9E2E; --gC:#3B7F22;
  --g1:#9E9E9E; --g2:#4CAF50; --g3:#2196F3; --g4:#9C27B0; --g5:#E0A100;
  --g6:#FF4081; --gold:#F2B824; --gem:#4FC3F7;
  /* 타이포 — 크기가 21가지로 흩어져 있던 걸 6단계로 정리했다 */
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
         'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  --fs-xxs:10px;   /* 도감 칸 이름 등 최소 */
  --fs-xs:11px;    /* 뱃지·보조 수치 */
  --fs-sm:12px;    /* 부제·설명 */
  --fs-md:13px;    /* 본문 기본 */
  --fs-lg:14px;    /* 행 제목 */
  --fs-xl:16px;    /* 화면 제목 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);
  font-size:var(--fs-md);line-height:1.45;letter-spacing:-.01em;
  word-break:keep-all;overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:#20301A;overflow:hidden;overscroll-behavior:none;user-select:none}
/* 한글은 단어 단위로 끊어야 읽힌다. keep-all 이 없으면 '오브제를' 같은 말이 중간에서 잘린다. */
h1,h2,h3,p,div,span,button,td,th{word-break:keep-all;overflow-wrap:anywhere}
/* 숫자는 자리폭을 고정해 타이머·수량이 덜컹거리지 않게 */
.pentime,.rd,.tc,.cnt,.rcnt,#coins,#gems,#lv{font-variant-numeric:tabular-nums}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;
  background:var(--paper);position:relative;box-shadow:0 0 40px rgba(0,0,0,.45)}

/* ═ HUD ═ */
header{background:linear-gradient(180deg,#6B4423,#523118);color:#fff;padding:7px 10px;z-index:8}
.hrow{display:flex;align-items:center;gap:7px}
.avatar{width:34px;height:34px;border-radius:11px;background:#8B5A2B;display:flex;align-items:center;
  justify-content:center;font-size:18px;border:2px solid rgba(255,255,255,.35);flex:none}
.who{flex:1;min-width:0}
.wname{font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px}
.lvchip{background:var(--gold);color:#5A3A00;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:900}
.xpbar{height:5px;background:rgba(0,0,0,.32);border-radius:3px;overflow:hidden;margin-top:3px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#FFD54F,#FF9800);width:0;transition:width .3s}
.cur{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border-radius:20px;
  padding:4px 6px 4px 8px;font-size:12px;font-weight:800;white-space:nowrap}
.cur .pl{background:rgba(255,255,255,.9);color:#4E3216;border-radius:50%;width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;cursor:pointer}
.lang{display:flex;background:rgba(0,0,0,.28);border-radius:20px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;font:inherit;font-size:11px;font-weight:800;padding:4px 7px;cursor:pointer;opacity:.5}
.lang button.on{background:rgba(255,255,255,.92);color:var(--brownD);opacity:1}

/* ═ 무대 ═ */
/* z-index를 명시해 무대를 독립된 쌓임 맥락으로 만든다.
   안 그러면 소품의 z(최대 99)가 무대를 빠져나가 아래 패널·탭바와 겨룬다 */
#stage{flex:1 1 auto;min-height:150px;position:relative;overflow:hidden;z-index:1;isolation:isolate;
  background-size:cover;background-position:center 72%;background-repeat:no-repeat;background-color:#BFE7FF}
#stage.t_grass{background-image:url('assets/bg/grass.webp')}
#stage.t_sand {background-image:url('assets/bg/sand.webp')}
#stage.t_snow {background-image:url('assets/bg/snow.webp')}
#stage.t_night{background-image:url('assets/bg/night.webp')}
.deco{position:absolute;pointer-events:none}
.sun{left:8%;top:6%;width:30px;height:30px;border-radius:50%;background:#FFE082;box-shadow:0 0 22px 9px rgba(255,224,130,.55)}
#stage.t_night .sun{background:#F5F3E7;box-shadow:0 0 20px 7px rgba(245,243,231,.4)}
.cloud{background:rgba(255,255,255,.85);border-radius:20px;height:14px}
.hill{left:-6%;top:20%;width:60%;height:16%;border-radius:50% 50% 0 0;background:rgba(255,255,255,.16)}
.pond{left:50%;top:52%;transform:translateX(-50%);width:56%;height:16%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#8ED8F8,#4FB3E3);box-shadow:inset 0 3px 8px rgba(0,0,0,.15)}
#stage.t_sand .pond{background:radial-gradient(ellipse at 50% 35%,#9FE2F5,#54BBE0)}
#stage.t_snow .pond{background:radial-gradient(ellipse at 50% 35%,#DFF3FF,#A9D4E9)}
#stage.t_night .pond{background:radial-gradient(ellipse at 50% 35%,#4E6E9B,#2C4467)}
.tuft{width:16px;height:10px;background:rgba(0,0,0,.09);border-radius:50% 50% 0 0}

/* 캐릭터와 상태 문구를 한 덩어리로 묶는다.
   예전엔 문구가 무대 바닥에 고정돼 캐릭터와 멀찍이 떨어졌고, 캐릭터를 옮기면 따로 놀았다. */
.penview{position:absolute;width:max-content;max-width:82%;
  transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.penview .sh{position:absolute;left:50%;transform:translateX(-50%);width:92px;height:17px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(20,12,4,.44) 0%,rgba(20,12,4,.17) 58%,rgba(20,12,4,0) 74%);
  z-index:0;pointer-events:none}
.penview img{width:min(120px,28vh);height:min(120px,28vh);object-fit:contain;position:relative;z-index:1;transform-origin:50% 100%;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.22));cursor:pointer}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-7px) scale(.96,1.05)}
  55%{transform:translateY(0) scale(1.05,.95)}75%{transform:translateY(0) scale(.99,1.01)}}
.breathe{animation:breathe 2.3s ease-in-out infinite}
@keyframes squash{0%{transform:scale(1,1)}18%{transform:scale(1.2,.78)}
  45%{transform:translateY(-28px) scale(.88,1.16)}70%{transform:translateY(0) scale(1.1,.92)}100%{transform:scale(1,1)}}
.squash{animation:squash .5s cubic-bezier(.3,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-18deg);opacity:0}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.pop{animation:pop .45s}
.pentime{font-size:12px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;margin-top:5px;
  background:rgba(30,20,10,.5);padding:3px 12px;border-radius:20px;white-space:nowrap;
  backdrop-filter:blur(2px)}
.pill .pn{opacity:.72;margin:0 2px}
.pill .ps{font-weight:900}
.penbar{width:100%;max-width:132px;height:6px;background:rgba(0,0,0,.3);border-radius:4px;
  overflow:hidden;margin-top:5px;align-self:center}
.penbar>i{display:block;height:100%;background:linear-gradient(90deg,#FFD54F,#FF9800);width:0}
.pill{position:absolute;z-index:150;left:50%;transform:translateX(-50%);top:6px;background:rgba(0,0,0,.42);color:#fff;
  border-radius:20px;padding:4px 13px;font-size:12px;font-weight:800;display:flex;gap:6px;align-items:center}
.objdeco{position:absolute;transform:translate(-50%,-100%);font-size:34px;line-height:1.25;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.32));pointer-events:none;z-index:0}
.objdeco img{width:var(--osz,56px);height:var(--osz,56px);object-fit:contain;display:block}
.objdeco.editing{pointer-events:auto;cursor:grab;touch-action:none;
  outline:2px dashed rgba(255,255,255,.9);outline-offset:3px;border-radius:8px;z-index:6}
.editbar{position:absolute;left:50%;transform:translateX(-50%);top:40px;z-index:160;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  background:linear-gradient(180deg,#FFF8EC,#FBEBD0);color:var(--brownD);
  border:2px solid #E3C69A;border-radius:22px;padding:5px 14px 5px 9px;
  font-size:12px;font-weight:900;letter-spacing:-.2px;
  box-shadow:0 3px 0 rgba(140,104,60,.28),0 6px 12px rgba(0,0,0,.16)}
.editbar .eb-ic{display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;border-radius:50%;background:#F3D9AE;font-size:13px;
  animation:ebwave 1.6s ease-in-out infinite}
@keyframes ebwave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.penview.editing{pointer-events:auto;cursor:grab;touch-action:none;
  outline:2px dashed rgba(255,255,255,.95);outline-offset:5px;border-radius:14px;z-index:6;
  background:rgba(255,255,255,.10)}
.eggbadge{position:absolute;right:12px;top:4px;background:#FFF1BF;color:#7A5300;border-radius:20px;
  padding:4px 11px 4px 9px;font-size:13px;font-weight:900;border:2px solid #F0C24A;
  box-shadow:0 2px 6px rgba(0,0,0,.22)}
.speedbar{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:7px;padding:0 12px;z-index:155}
.speedbar .poopbtn{background:linear-gradient(180deg,#E0A100,#B47C00);font-size:14px;padding:12px 8px;
  animation:bpulse 1.3s ease-in-out infinite}
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.speedbar .btn{flex:1 1 0 !important;min-width:0;box-shadow:0 3px 8px rgba(0,0,0,.28);
  padding:9px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coinpop{position:absolute;top:42%;left:50%;transform:translateX(-50%);background:var(--gold);color:#5A3A00;
  border-radius:20px;padding:5px 14px;font-size:14px;font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,.25);
  display:none;z-index:3}
.coinpop.on{display:block;animation:pop .4s}
.emptyhint{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;color:#fff;
  font-size:14px;font-weight:800;line-height:1.7;background:rgba(30,20,10,.5);padding:11px 20px;
  border-radius:18px;backdrop-filter:blur(2px);max-width:88%;white-space:pre-line}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.32);color:#fff;border:0;
  width:30px;height:44px;font-size:16px;cursor:pointer;z-index:140}
.arrow.l{left:0;border-radius:0 12px 12px 0}
.arrow.r{right:0;border-radius:12px 0 0 12px}
.lockbig{position:absolute;inset:34% 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.lockbig .lk{font-size:44px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.lockbig .lt{color:#fff;font-size:13px;font-weight:800;text-shadow:0 2px 3px rgba(0,0,0,.4);text-align:center;line-height:1.6}

/* ═ 하위탭 ═ */
.seg{display:flex;gap:5px;padding:7px 9px 0;background:var(--paper)}
.seg button{flex:1;background:#F1E6D6;border:0;border-radius:11px 11px 0 0;font:inherit;font-size:12px;
  font-weight:800;color:#8E7F6D;padding:8px 2px;cursor:pointer}
.seg button.on{background:#fff;color:var(--brownD);box-shadow:0 -2px 0 var(--brown) inset}

/* ═ 패널 ═ */
#panel{flex:0 0 auto;height:clamp(190px,34vh,320px);min-height:0;background:var(--paper);display:flex;flex-direction:column;z-index:4;border-top:2px solid var(--line)}
.pbody{flex:1;overflow-y:auto;padding:9px 10px 14px;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 16px),transparent 100%)}
.ptitle{padding:9px 12px 0;font-size:var(--fs-xl);font-weight:800;color:var(--brownD);
  letter-spacing:-.02em;line-height:1.3;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
#helpbtn{background:#F1E6D6;border:0;border-radius:9px;color:var(--brownD);font:inherit;font-size:11px;
  font-weight:800;padding:5px 9px;cursor:pointer;display:none}
#helpbtn.on{display:inline-block}
.psub{padding:3px 12px 0;font-size:var(--fs-sm);color:var(--dim);line-height:1.5;
  max-width:36em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 3px 5px;text-align:center;
  cursor:pointer;position:relative;transition:.1s}
.tile.sel{background:var(--brown);color:#fff;border-color:var(--brown);transform:translateY(-2px)}
.tile.dis{opacity:.38}
.tile .ti{font-size:21px;line-height:1.25}
/* 똥 먹이 썸네일 — 원본이 128px라 크기를 안 잡으면 그대로 튀어나온다 */
.pfimg{width:26px;height:26px;object-fit:contain;vertical-align:middle;max-width:100%;max-height:100%}
.tile .pfimg{width:26px;height:26px}
.tile.pf{border-color:#C9A227;background:#FFFBEF}
.tile.pf.sel{background:var(--brown);border-color:var(--brown)}
.tile .tn{font-size:var(--fs-xs);font-weight:700;margin-top:3px;line-height:1.3}
.tile .tc{font-size:var(--fs-xxs);opacity:.8;margin-top:1px;line-height:1.3}
.cnt{position:absolute;top:-5px;right:-4px;background:var(--brownD);color:#fff;font-size:11px;font-weight:900;
  border-radius:9px;padding:1px 5px;min-width:18px}
.tile.sel .cnt{background:#fff;color:var(--brownD)}
.actbar{display:flex;align-items:center;gap:7px;padding:7px 10px;border-top:1px solid var(--line);background:#fff}
.slotpick{border:2px dashed var(--line);border-radius:11px;width:42px;height:42px;display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--dim);flex:none}
.slotpick.has{border-style:solid;border-color:var(--brown);overflow:hidden}
.slotpick .pfimg{width:32px;height:32px}
.slotpick.lock{border-style:solid;border-color:var(--line);background:#efe6da;opacity:.75;font-size:16px}
.rgroup{display:flex;align-items:center;gap:8px;background:#f1e6d7;border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;margin:7px 0 3px;cursor:pointer;user-select:none}
.rgroup.open{background:#e9dbc6}
.rgroup.dim{opacity:.62}
.rgroup .rn{font-size:var(--fs-lg);font-weight:800;color:var(--brownD);
  display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
.rgroup .rd{font-size:var(--fs-sm);color:var(--dim);margin-top:2px}
.btn .b1{display:block;line-height:1.3}
.btn .b2{display:block;font-size:11px;font-weight:800;opacity:.85;line-height:1.2;margin-top:1px}
.rcnt{font-size:11px;font-weight:800;color:#fff;background:var(--brown);border-radius:20px;padding:1px 7px}
.ogr{font-size:11px;font-weight:900;color:#fff;border-radius:20px;padding:1px 6px;margin-left:4px}
.ogr.g0{background:#9E9E9E}.ogr.g1{background:#4CAF50}.ogr.g2{background:#2196F3}.ogr.g3{background:#9C27B0}
.rarrow{font-size:13px;color:var(--dim);font-weight:900}
.row.sub{margin-left:14px}
.btn{border:0;border-radius:12px;background:var(--brown);color:#fff;font:inherit;font-weight:900;padding:11px 13px;
  cursor:pointer;font-size:14px;flex:1}
.btn.g{background:#2E7D32}.btn.o{background:#EF6C00}.btn.b{background:#1565C0}
/* 색 버튼 규칙보다 뒤에 둬야 이긴다. 앞에 두면 비활성인데 초록으로 남아 눌리는 줄 안다 */
.btn:disabled,.btn.g:disabled,.btn.o:disabled,.btn.b:disabled{
  background:#CFC0AE;color:#F3EDE4;cursor:default;opacity:1}
.btn.ghost{background:#fff;color:var(--brownD);border:2px solid var(--line)}
.btn.sm{padding:8px 11px;font-size:12px;flex:none}
.row{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;margin-bottom:6px}
.row.done{background:#F2F8F1;border-color:#CFE3CB}
.row .ri{font-size:21px;width:28px;text-align:center;flex:none}
.row .rt{flex:1;min-width:0}
.row .rn{font-size:var(--fs-lg);font-weight:700;line-height:1.35;letter-spacing:-.02em}
.row .rd{font-size:var(--fs-sm);color:var(--dim);margin-top:3px;line-height:1.45}
.mini{height:5px;background:#EFE4D6;border-radius:3px;overflow:hidden;margin-top:4px}
.mini>i{display:block;height:100%;background:linear-gradient(90deg,#8B5A2B,#E0A100)}
.ok{font-size:11px;font-weight:900;color:#2E7D32}
.dcell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 2px 3px;text-align:center;
  position:relative;cursor:pointer}
.dcell img{width:100%;max-width:44px;height:42px;object-fit:contain}
.ricon{width:30px;height:30px;object-fit:contain;flex:none}
.ricon.silh{filter:grayscale(1) brightness(.15) opacity(.42)}
.rem{font-size:21px;line-height:1}
.qmt{color:#B5A48F;font-weight:800}
.qm{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
  background:#EDE2D2;border-radius:9px;font-weight:900;color:#B5A48F;font-size:16px}
.dcell .dn{font-size:var(--fs-xxs);font-weight:600;line-height:1.25;height:21px;overflow:hidden;
  color:var(--brownD);margin-top:2px;letter-spacing:-.03em}
.dcell.lock .dn{color:#C3B6A5}
.dcell.lock img{filter:grayscale(1) brightness(.12) opacity(.34)}
.dot{width:6px;height:6px;border-radius:50%;position:absolute;top:3px;right:3px}
/* 오른쪽 아래에 두면 '개똥벌레똥' 같은 긴 이름의 끝을 덮는다. 등급 점 반대편 위로 올린다 */
.have{position:absolute;top:3px;left:3px;background:var(--brownD);color:#fff;font-size:10px;font-weight:900;

function matchRecipe(parentNo,pick){
  if(!parentNo||!pick||!pick.length)return null;
  const key=[...pick].sort().join('|');
  return RECIPE.find(r=>r.pa===parentNo&&r.f.length===pick.length&&[...r.f].sort().join('|')===key)||null;
}

const PITY_STEP=0.05;
const isCertain=r=>r.k==='x'||r.k==='X';
function pityKey(r){return r.pa+'>'+[...r.f].sort().join('+');}
function effProb(r){
  if(!isCertain(r)) return r.p;
  const n=(S.pity&&S.pity[pityKey(r)])||0;
  return Math.min(1, r.p + PITY_STEP*n);
}
function bumpPity(r,hit){
  if(!isCertain(r)) return;
  if(!S.pity)S.pity={};
  const k=pityKey(r);
  if(hit) delete S.pity[k]; else S.pity[k]=(S.pity[k]||0)+1;
}

}

/* ── 효과음 — 샘플 파일 없이 WebAudio로 즉석 합성한다.
   단일 HTML 게임이라 에셋을 늘리지 않는 게 맞고, 라이선스 문제도 없다.
   브라우저 정책상 첫 터치 전에는 소리를 못 내므로 pointerdown에서 게으르게 연다. ── */
const SND={on:Store.get('poopy_snd')!=='off',ctx:null};
document.addEventListener('pointerdown',()=>{ if(!SND.on)return;
  try{ if(!SND.ctx)SND.ctx=new (window.AudioContext||window.webkitAudioContext)();
       if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume(); }catch(e){} },{capture:true});
function tone(f,dur,type,vol,when,slide){ if(!SND.on||!SND.ctx)return;
  const c=SND.ctx,t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.1,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03); }
const SFX={

const newState=()=>({
  coins:60,gems:0,lv:1,exp:0,
  open:[true,false,false,false,false,false],
  pens:new Array(MAX_PENS).fill(null),
  sel:0, inv:{}, found:{}, food:{grass:10,bug:10,meat:2,fish:2,feed:0,junk:0}, regen:Date.now(),
  wildNext:0, wildAd:{d:'',n:0}, pity:{}, rOpen:{},
  theme:'grass', themes:['grass'],
  objs:{},        // {오브제id: 보유 개수}
  slots:[],       // 방에 놓인 것 [{id, x, y}] — 같은 오브제를 여러 개 놓을 수 있다
  editObj:false, moveMode:'obj',   // 'obj' | 'poop' — 옮기기 대상
  pick:[], tut:0, daily:{date:'',p:[0,0,0],c:[0,0,0]}, adcd:{coin:0,feed:0,speed:0}, lvClaim:1,
  stat:{hatch:0,coin:0,feed:0,gRare:0,gEpic:0,gLegend:0,streak:1,last:''}, ach:{}, uniq:[], rcp:{}
});
let S=newState(), TAB='home', SEG='feed', SHOPSEG='food', DEXSEG='list';
function load(){
  try{const r=Store.get(KEY);if(r)Object.assign(S,JSON.parse(r));}catch(e){}
  const d=newState();
  for(const k in d) if(S[k]===undefined) S[k]=d[k];
  while(S.open.length<MAX_PENS)S.open.push(false);
  while(S.pens.length<MAX_PENS)S.pens.push(null);
  S.open[0]=true;S.open.length=MAX_PENS;S.pens.length=MAX_PENS;
  // 구버전(objs 배열 + objOn + objPos) → 신버전(수량 맵 + 슬롯) 이관
  if(Array.isArray(S.objs)){
    const owned=S.objs, on=Array.isArray(S.objOn)?S.objOn:[], op=S.objPos||{};
    S.objs={}; owned.forEach(id=>{S.objs[id]=(S.objs[id]||0)+1;});
    S.slots=on.map((id,k)=>{
      const p=op[id]||OBJ_POS[k%OBJ_POS.length];
      return {id,x:p[0],y:p[1]};
    });
    delete S.objOn; delete S.objPos;
  }
  if(!S.objs||Array.isArray(S.objs)) S.objs={};
  if(!Array.isArray(S.slots)) S.slots=[];
  if(!S.poopPos) S.poopPos={};

  // ── 값 정규화 ──
  // 저장 데이터가 조금만 어긋나도 화면이 통째로 죽는 일이 있었다. (S.sel이 범위 밖이면 흰 화면)
  const numOr=(v,d,min,max)=>{ const n=Number(v);
    if(!isFinite(n)) return d;
    return Math.max(min, Math.min(max, Math.floor(n))); };
  S.coins = numOr(S.coins, 0, 0, 1e15);
  S.gems  = numOr(S.gems,  0, 0, 1e9);
  S.lv    = numOr(S.lv,    1, 1, MAX_LV);
  S.exp   = numOr(S.exp,   0, 0, 1e12);
  S.sel   = numOr(S.sel,   0, 0, MAX_PENS-1);
  if(!S.open[S.sel]) S.sel = Math.max(0, S.open.findIndex(Boolean));
  S.tut   = numOr(S.tut,   0, 0, 99);
  S.lvClaim = numOr(S.lvClaim, 1, 1, MAX_LV);
  // 없는 오브제·종을 가리키는 찌꺼기 제거
  Object.keys(S.objs).forEach(k=>{ const n=numOr(S.objs[k],0,0,999);
    if(!objDef(k)||n<=0) delete S.objs[k]; else S.objs[k]=n; });
  S.slots = S.slots.filter(sl=>sl&&objDef(sl.id))
    .map(sl=>({id:sl.id, x:numOr(sl.x,50,0,100), y:numOr(sl.y,80,0,100)}));
  S.pens = S.pens.map(c=>{
    if(!c||!spOf(c.no)) return null;
    if(c.feed&&(!spOf(c.feed.out)||!Array.isArray(c.feed.pick))) c.feed=null;
    return c; });
  if(!Array.isArray(S.themes)||!S.themes.length) S.themes=['grass'];
  if(!THEMES.some(t2=>t2.id===S.theme)) S.theme='grass';
  Object.keys(S.inv||{}).forEach(k=>{ if(!spOf(+k)||!(S.inv[k]>0)) delete S.inv[k]; });
  Object.keys(S.found||{}).forEach(k=>{ if(!spOf(+k)) delete S.found[k]; });
  rollDaily(); checkStreak(); regenFood(); wildTick(true);
}

const invCount=no=>S.inv[no]||0;

const today=()=>new Date().toISOString().slice(0,10);

function regenFood(){
  if(!S.regen)S.regen=Date.now();
  const el=Date.now()-S.regen; const gain=Math.floor(el/REGEN_MS);
  if(gain>0){
    BASIC.forEach(id=>{ S.food[id]=Math.min(REGEN_CAP,(S.food[id]||0)+gain); });
    S.regen += gain*REGEN_MS;
  }
}
function regenLeft(){ if(!S.regen)return REGEN_MS; return REGEN_MS-((Date.now()-S.regen)%REGEN_MS); }

const nameOf=s=>LANG==='ko'?s[2]:s[3];
const descOf=s=>LANG==='ko'?s[5]:s[6];
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}
function num(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n).toLocaleString();}
function toast(m){const el=$('toast');el.textContent=m;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2100);}
function probs(ts){const b=ts-2;
  const w=[100-b*11,22+b*5,6+b*4,1.2+b*1.8,0.25+b*0.75].map(x=>Math.max(x,0));
  const tot=w.reduce((a,c)=>a+c,0);return w.map(x=>x/tot);}
function rollGrade(ts){const p=probs(ts);let r=Math.random();
  for(let i=0;i<5;i++){r-=p[i];if(r<=0)return i;}return 0;}
const pickSpecies=g=>BY_GRADE[g][Math.floor(Math.random()*BY_GRADE[g].length)];
// 똥 먹이: id가 'p{도감번호}' 형태. 등급이 높을수록 tier가 높다.
function isPoopFood(id){return typeof id==='string'&&id[0]==='p'&&/^\d+$/.test(id.slice(1));}
function poopFoodNo(id){return parseInt(id.slice(1),10);}
function foodDef(id){
  if(isPoopFood(id)){const sp=spOf(poopFoodNo(id));
    return {id,poop:true,sp,tier:sp[4]+2,cost:0,inf:false};}
  return FOODS.find(x=>x.id===id);
}
function allFoods(){
  const list=FOODS.slice();
  Object.keys(S.food||{}).forEach(k=>{ if(isPoopFood(k)&&S.food[k]>0) list.push(foodDef(k)); });
  return list;
}
function foodQty(id){const f=foodDef(id);return f&&f.inf?Infinity:(S.food[id]||0);}
function foodName(f){return f.poop?nameOf(f.sp):t('foods')[f.id];}

function addXp(n){
  if(S.lv>=MAX_LV){S.exp=needXp(MAX_LV);return;}
  S.exp+=n; let up=0;
  while(S.lv<MAX_LV&&S.exp>=needXp(S.lv)){S.exp-=needXp(S.lv);S.lv++;up++;}
  if(S.lv>=MAX_LV){S.lv=MAX_LV;S.exp=needXp(MAX_LV);}
  if(up){toast(S.lv>=MAX_LV?t('lvMax'):t('lvUp')(S.lv)); adBreak('levelup');} }
function bump(i,n){ rollDaily(); S.daily.p[i]=(S.daily.p[i]||0)+n; }

function lvReward(l){
  const r={c:l*120};
  if(l%5===0)r.g=3;
  if(l%10===0){r.c=l*300;r.g=8;}
  if(l%50===0){r.c=l*600;r.g=40;}
  if(l%30===0)r.uniq=true;
  return r;
}
const UNIQ=[201,202,203];
function ownUniq(){return (S.uniq||[]);}
function statVal(k){
  if(k==='dex')return dexCount();
  if(k==='pens')return S.open.filter(Boolean).length;
  if(k==='deco')return S.themes.length+Object.values(S.objs||{}).reduce((a,b)=>a+b,0);
  return (S.stat&&S.stat[k])||0;
}
function achTier(a){ const v=statVal(a.st); let i=0; while(i<a.steps.length&&v>=a.steps[i])i++; return i; }
function achClaimed(a){ return (S.ach&&S.ach[a.id])||0; }
function achReady(a){ return S.lv>=a.lv && achTier(a)>achClaimed(a); }
function bumpStat(k,n){ if(!S.stat)S.stat={}; S.stat[k]=(S.stat[k]||0)+n; }
function checkStreak(){
  if(!S.stat)S.stat={};
  const d=today(); if(S.stat.last===d)return;
  const y=new Date(Date.now()-86400e3).toISOString().slice(0,10);
  S.stat.streak = (S.stat.last===y)?(S.stat.streak||1)+1:1;
  S.stat.last=d;
}
function dailyDone(i){return S.daily.p[i]>=DAILY_GOAL[i];}
function questAlert(){
  rollDaily();
  if(S.tut<6) return true;
  for(let i=0;i<3;i++) if(dailyDone(i)&&!S.daily.c[i]) return true;
  if(S.lv>S.lvClaim) return true;
  if(ACH.some(a=>achReady(a))) return true;
  return false;
}

/* ════════ 먹이 슬롯 · 야생 방문 ════════ */
const SLOT_UNLOCK=8;                       // 도감 8종이면 먹이 2칸
const slots=()=>dexCount()>=SLOT_UNLOCK?2:1;
const WILD_MS=6*3600*1000;                 // 이후 6시간마다 한 마리
const WILD_AD_MAX=2;                       // 광고 즉시 호출 하루 2회
const emptyPen=()=>S.pens.findIndex((x,i)=>S.open[i]&&!x);

// 서식지별 방문 가중치 — [일반,고급,희귀,영웅,전설]
const HAB_W={grass:[70,25,4.5,0.5,0], sand:[46,34,17,2.6,0.4],
             snow:[30,32,26,10,2], night:[18,26,28,18,10]};
function wildPool(g){
  const th=S.theme;
  return BY_GRADE[g].filter(sp=>{
    const no=sp[0];
    if(sp[4]===5) return false;            // 유니크는 퀘스트로만
    if(isCraftOnly(no)) return false;      // 조합 전용은 야생에 안 나옴
    const h=habitatOf(no);
    return !h || h===th;                   // 서식지 전용은 그 배경에서만
  });
}
function rollWild(){
  const w=HAB_W[S.theme]||HAB_W.grass;
  const tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot, g=0;
  for(let i=0;i<w.length;i++){ if(r<w[i]){g=i;break;} r-=w[i]; }
  let pool=wildPool(g);
  while(!pool.length&&g>0){ g--; pool=wildPool(g); }
  return pool[Math.floor(Math.random()*pool.length)];
}
// 서식지 히든은 그 배경에서만 별도 확률로 한 번 더 굴린다
function wildVisit(firstEver){
  const free=emptyPen(); if(free<0) return false;
  let sp=null;
  if(firstEver){
    // 맨 처음 한 마리는 반드시 일반 등급. 희귀가 걸리면 첫 똥까지 30분을 기다리게 된다.
    const pool=wildPool(0);
    sp=pool[Math.floor(Math.random()*pool.length)];
  }
  if(!sp){
    const hid=Object.keys(HABITAT).map(Number).filter(no=>HABITAT[no]===S.theme&&!S.found[no]);
    if(hid.length&&Math.random()<0.18) sp=spOf(hid[Math.floor(Math.random()*hid.length)]);
  }
  if(!sp) sp=rollWild();
  if(!sp) return false;
  S.pens[free]={no:sp[0],feed:null,wild:true};
  if(!S.found[sp[0]]){S.found[sp[0]]=true;checkQuests();}
  return free;
}
function wildTick(silent){
  const now=Date.now();
  if(!S.wildNext){                                  // 첫 시작 — 즉시 한 마리
    const at=wildVisit(true); S.wildNext=now+WILD_MS;
    if(at!==false&&!silent) toast(t('wildCame'));
    return;
  }
  if(emptyPen()<0){ S.wildNext=Math.max(S.wildNext,now+WILD_MS); return; }
  let came=0;
  while(now>=S.wildNext && emptyPen()>=0 && came<MAX_PENS){
    if(wildVisit()===false) break;
    S.wildNext+=WILD_MS; came++;
  }
  if(came&&!silent) toast(t('wildCame'));
}
function wildLeft(){ return Math.max(0,(S.wildNext||0)-Date.now()); }
function wildAdLeft(){
  if(!S.wildAd||S.wildAd.d!==today()) S.wildAd={d:today(),n:0};
  return WILD_AD_MAX-S.wildAd.n;
}
function wildByAd(){
  if(emptyPen()<0) return toast(t('wildFull'));
  if(wildAdLeft()<=0) return toast(t('wildAdOut'));
  adBreak('reward'); S.wildAd.n++;
  const at=wildVisit();
  if(at!==false){ S.sel=at; save(); renderAll(); toast(t('wildCame')); }
}

// idx가 숫자면 오브제 슬롯, 'poop'이면 똥 위치를 옮긴다
function makeDraggable(el,idx){
  let dragging=false;
  const move=ev=>{
    if(!dragging)return; ev.preventDefault();
    const r=$('stage').getBoundingClientRect();
    let x=(ev.clientX-r.left)/r.width*100, y=(ev.clientY-r.top)/r.height*100;
    // 무대 위쪽 절반은 하늘·울타리다. 땅 위(세로 52% 아래)로만 놓게 막는다.
    // 안 막으면 똥이 구름 위에 떠 있게 된다.
    // 어디든 놓을 수 있게 둔다 — 연못 위에 앉히든 하늘에 띄우든 그건 취향이다.
    // 화면 밖으로 나가 사라지는 것만 막는다.
    x=Math.max(8,Math.min(92,x)); y=Math.max(18,Math.min(99,y));
    el.style.left=x+'%'; el.style.top=y+'%';
    const rx=Math.round(x*10)/10, ry=Math.round(y*10)/10;
    if(idx==='poop'){ if(!S.poopPos)S.poopPos={}; S.poopPos[S.sel]=[rx,ry]; }
    else if(S.slots[idx]){ S.slots[idx].x=rx; S.slots[idx].y=ry; }
  };
  const up=()=>{ if(!dragging)return; dragging=false; save();
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); };
  el.addEventListener('pointerdown',ev=>{ dragging=true; ev.preventDefault();
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); });
}
function tickClock(){
  const n=new Date(),p=x=>String(x).padStart(2,'0');
  const el=$('clock'); if(!el)return;
  el.textContent = LANG==='ko'
    ? `${n.getFullYear()}. ${n.getMonth()+1}. ${n.getDate()}.  ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`
    : `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}  ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}
function squash(){const im=$('mainpoop');if(!im)return;im.classList.remove('squash');void im.offsetWidth;im.classList.add('squash');}
function speedCost(c){
  // 남은 시간 1분당 (등급+1)×2 코인. 예전엔 10초당이라 초반에 400코인이 넘어 아무도 못 썼다.
  const sp=spOf(c.no); const left=c.feed?Math.max(0,c.feed.end-Date.now())/1000:0;
  return Math.max(5,Math.ceil(left/60)*(sp[4]+1)*2);
}
function speedUp(i,byAd){
  const c=S.pens[i]; if(!c||!c.feed)return;
  if(!byAd){ const cost=speedCost(c); if(S.coins<cost)return toast(t('noCoin')); S.coins-=cost; }
  else { const now=Date.now(); if(now-(S.adcd.speed||0)<180e3) return; S.adcd.speed=now; adBreak('reward'); }
  c.feed.end=Date.now(); save(); renderAll(); toast(t('speedDone'));
}

/* ════════ 액션 ════════ */
// 소화 시간 — 부모 등급이 기준이라 결과가 노출되지 않는다. 먹이가 무거우면 조금 더 걸린다
// 첫 배출만 짧게 — 처음 온 사람은 3분을 못 기다린다.
// 웹게임 포털은 "1분 이상 논 사람 비율"을 핵심 지표로 본다. 첫 똥이 3분 뒤에 나오면
// 아무 일도 안 일어난 채로 이탈한다. 한 번만 45초로 줄여 루프를 눈으로 보게 한다.
const FIRST_DIGEST_MS=45*1000;
function digestMs(parentGrade, tierSum){
  // 무거운 밥은 오래 걸린다. 흔한 똥이라도 고기를 두 덩이 먹으면 반나절을 소화한다.
  // 부모 등급과 밥의 무게 중 큰 쪽이 시간을 정하므로, 결과 등급은 여전히 드러나지 않는다.
  const g=Math.max(0,Math.min(5,Math.max(parentGrade, tierSum-2)));
  const ms=Math.round(GT[g]*1000*(1+0.10*tierSum));
  const first=!S.stat||!S.stat.hatch;          // 아직 한 번도 안 받아봤다
  return first ? Math.min(ms, FIRST_DIGEST_MS) : ms;
}
// 먹이 주기 — 반드시 부모 똥이 앉아 있는 칸에만
function feedPen(){
  const i=S.sel, c=S.pens[i];
  if(!S.open[i]) return toast(t('penLocked'));
  if(!c) return toast(t('needParent'));
  if(c.feed) return toast(t('busyDigest'));
  if(S.pick.length<1) return;
  if(S.pick.length>slots()) return toast(t('slotLocked')(SLOT_UNLOCK));
  for(const id of S.pick){ if(foodQty(id)<=0) return toast(t('goNoFood')); }

  let ts=0;
  S.pick.forEach(id=>{const f=foodDef(id);ts+=f.tier;
    if(!f.inf){S.food[id]=(S.food[id]||0)-1; if(S.food[id]<=0)delete S.food[id];}
    bump(2,1); bumpStat('feed',1);});

  // 조합 판정 — 부모 + 먹이 조합이 맞으면 그 결과, 아니면 등급표
  const rc=matchRecipe(c.no,S.pick);
  let outNo, viaRecipe=false;
  if(rc){
    const p=effProb(rc), hit=Math.random()<p;
    bumpPity(rc,hit);
    if(hit){ outNo=rc.no; viaRecipe=true; if(!S.rcp)S.rcp={}; S.rcp[RECIPE.indexOf(rc)]=1; }
    else if(isCertain(rc)){ outNo=consolation(rc.no); }   // 똥을 태운 확정 조합은 한 등급 아래 보장
    else {                                                // 흔한 먹이로 찔러본 조합은 그냥 운
      const g=rollGrade(ts);
      const pool=BY_GRADE[g].filter(x=>!isCraftOnly(x[0])&&!habitatOf(x[0])&&x[4]<5);
      const use=pool.length?pool:BY_GRADE[0];
      outNo=use[Math.floor(Math.random()*use.length)][0];
    }
  } else {
    const g=rollGrade(ts);
    const pool=BY_GRADE[g].filter(x=>!isCraftOnly(x[0])&&!habitatOf(x[0])&&x[4]<5);
    const use=pool.length?pool:BY_GRADE[0];
    outNo=use[Math.floor(Math.random()*use.length)][0];
  }
  const now=Date.now();
  c.feed={pick:[...S.pick], out:outNo, via:viaRecipe, start:now, end:now+digestMs(spOf(c.no)[4],ts)};
  sfx('feed'); S.pick=[]; tutStep(0); save(); renderAll();
  const im=$('mainpoop'); if(im) im.classList.add('pop');
}
const drop=feedPen;   // 구 이름 호환

// 똥 누기 — 부모는 그대로 남는다
function doPoop(i){
  const c=S.pens[i]; if(!c||!c.feed||Date.now()<c.feed.end) return;
  const sp=spOf(c.feed.out), isNew=!S.found[sp[0]];
  S.found[sp[0]]=true; S.inv[sp[0]]=(S.inv[sp[0]]||0)+1;
  addXp(GXP[sp[4]]*(isNew?2:1)); bump(0,1); bumpStat('hatch',1);
  if(sp[4]===2)bumpStat('gRare',1); if(sp[4]===3)bumpStat('gEpic',1); if(sp[4]===4)bumpStat('gLegend',1);
  c.feed=null;                       // 부모는 계속 이 칸에 산다
  sfx(isNew?(sp[4]>=4?'lgnd':'nu'):'poop');
  tutStep(1); checkQuests(); save(); renderAll(); showCard(sp,isNew);
}
const hatch=doPoop;   // 구 이름 호환

// 도감에서 부모로 앉히기
function placeInPen(no,i){
  if(!S.open[i]) return toast(t('penLocked'));
  if(invCount(no)<1) return toast(t('noStock'));
  const cur=S.pens[i];
  if(cur&&cur.feed) return toast(t('busyDigest'));
  if(cur){ S.inv[cur.no]=(S.inv[cur.no]||0)+1; }   // 있던 부모는 도감으로 돌아간다
  S.inv[no]-=1; if(S.inv[no]<=0) delete S.inv[no];
  S.pens[i]={no:no,feed:null};
  S.sel=i; TAB='home'; save(); closeModal(); renderAll();
  toast(t('placed')(nameOf(spOf(no)),i+1));
}
// 부모를 도감으로 돌려보내기
function unplacePen(i){
  const c=S.pens[i]; if(!c) return;
  if(c.feed) return toast(t('busyDigest'));
  S.inv[c.no]=(S.inv[c.no]||0)+1; S.pens[i]=null;
  save(); renderAll(); toast(t('unplaced'));
}

function sellPoop(no,qty){
  const have=invCount(no); if(have<1) return toast(t('noStock'));
  const n=Math.max(1,Math.min(qty||1,have));
  const sp=spOf(no), total=SELL[sp[4]]*n;
  S.inv[no]-=n; if(S.inv[no]<=0) delete S.inv[no];
  S.coins+=total; bumpStat('coin',total); bump(1,total); tutStep(2);
  sfx('coin'); save(); closeModal(); renderAll();
  toast(n>1?t('soldAll')(n,num(total)):t('sold')(nameOf(sp),num(total)));
}
// 조합 재료로 쓰이는 똥은 넉넉히 남긴다 — 중복 판매가 재료를 팔아버리면 안 된다
function keepCount(no){
  let need=1;
  RECIPE.forEach(r=>{
    if(S.found[r.no]&&r.k!=='X') return;          // 이미 얻은 결과는 재료를 아낄 필요 없음
    const uses=r.f.filter(f=>isPoopFood(f)&&poopFoodNo(f)===no).length;
    if(uses) need=Math.max(need, uses + (r.pa===no?1:0));
  });
  return Math.min(need,3);
}
function sellDuplicates(){
  let cnt=0,total=0;
  Object.keys(S.inv).forEach(k=>{
    const keep=keepCount(+k), n=S.inv[k]-keep;
    if(n>0){ const sp=spOf(+k); total+=SELL[sp[4]]*n; cnt+=n; S.inv[k]=keep; }
  });
  if(!cnt) return toast(t('sellDupNone'));
  S.coins+=total; bumpStat('coin',total); bump(1,total); tutStep(2);
  sfx('coin'); save(); renderAll(); toast(t('soldAll')(cnt,num(total)));
}
function _sellPoopOld(no){
  if(invCount(no)<1) return toast(t('noStock'));
  const sp=spOf(no), price=SELL[sp[4]];
  S.inv[no]--; if(S.inv[no]<=0) delete S.inv[no];
  S.coins+=price; bumpStat('coin',price); bump(1,price); tutStep(2);
  save(); closeModal(); renderAll(); toast(t('sold')(nameOf(sp),price));
}
function breakDown(no){
  if(invCount(no)<1)return toast(t('noStock'));
  const sp=spOf(no), fid='p'+no;
  S.inv[no]--; if(S.inv[no]<=0) delete S.inv[no];
  S.food[fid]=(S.food[fid]||0)+1; sfx('tap'); tutStep(4);
  save(); closeModal(); renderAll();
  toast(t('brokePoop')(nameOf(sp)));
}

  else if(TAB==='shop'&&SHOPSEG==='gem'){
    [[10,'₩1,900','$1.99'],[60,'₩9,900','$9.99'],[200,'₩29,000','$29.99']].forEach(([g,kp,ep])=>{
      const r=document.createElement('div');r.className='row';
      r.innerHTML=`<div class="ri">💎</div><div class="rt"><div class="rn">${t('gemPack')(g,LANG==='ko'?kp:ep)}</div></div>`;
      r.appendChild(iapButton('btn g sm'));body.appendChild(r);
    });
    body.appendChild(adCard('coin'));
    { const k=kofiCard(); if(k) body.appendChild(k); }
  }
  else if(TAB==='shop'&&SHOPSEG==='deco'){
    const h1=document.createElement('div');h1.className='rhead';h1.textContent=t('decoBg');
    body.appendChild(h1);
    let any=false;
    THEMES.forEach(th=>{
      const own=S.themes.includes(th.id);
      const r=document.createElement('div');r.className='row'+(own?' done':'');
      r.innerHTML=`<div class="ri">${th.ic}</div><div class="rt"><div class="rn">${t('themes')[th.id]}</div>
        <div class="rd">${own?t('own'):(th.cur==='gem'?'💎 '+th.cost:'🪙 '+num(th.cost))}</div></div>`;
      const b2=document.createElement('button');b2.className='btn sm'+(own?' ghost':'');
      b2.textContent=own?t('own'):t('buy'); b2.disabled=own;
      b2.onclick=()=>{
        if(th.cur==='gem'){if(S.gems<th.cost)return toast(t('noGem'));S.gems-=th.cost;}
        else{if(S.coins<th.cost)return toast(t('noCoin'));S.coins-=th.cost;}
        S.themes.push(th.id);S.theme=th.id;save();renderAll();
        sfx('buy');toast(t('boughtBg')(t('themes')[th.id]));};   // 배경은 수량이 없다 — (×1)을 붙이면 이상하다
      r.appendChild(b2);body.appendChild(r); any=true;
    });
    const h2=document.createElement('div');h2.className='rhead';h2.textContent=t('decoObj');
    body.appendChild(h2);
    OBJECTS.forEach(o=>{
      const own=objOwned(o.id), quest=o.cur==='quest';
      const r=document.createElement('div');r.className='row'+(own?' done':'');
      r.innerHTML=`<div class="ri"><img src="assets/obj/${o.id}.webp" style="width:30px;height:30px;object-fit:contain"
          onerror="this.replaceWith(document.createTextNode('${o.ic}'))"></div>
        <div class="rt"><div class="rn">${t('objs')[o.id]}
          ${own?`<span class="rcnt">×${own}</span>`:''}
          <span class="ogr g${o.g}">${t('objG')[o.g]}</span></div>
        <div class="rd">${quest?'🎯 '+t('questOnly')
            :(o.cur==='gem'?'💎 '+o.cost:'🪙 '+num(o.cost))} · ${t('objSize')(Math.round(o.sz*100))}</div></div>`;
      const b2=document.createElement('button');b2.className='btn sm'+(quest?' ghost':'');
      b2.textContent=quest?'🎯':t('buy'); b2.disabled=quest;
      b2.onclick=()=>objBuy(o);
      r.appendChild(b2);body.appendChild(r);
    });
  }
  else if(TAB==='quest'){
    rollDaily();
    const sec=(title)=>{const h=document.createElement('div');
      h.style.cssText='font-size:12px;font-weight:900;color:var(--brownD);margin:4px 0 6px';
      h.textContent=title;body.appendChild(h);};
    sec(t('qTut'));
    t('tut').forEach((q,i)=>{
      const done=S.tut>i;
      const r=document.createElement('div');r.className='row'+(done?' done':'');
      r.innerHTML=`<div class="ri">${done?'✅':TUT_IC[i]}</div>
        <div class="rt"><div class="rn">${q}</div>
        <div class="rd">${done?t('claimed'):'🪙 60'}</div></div>`;
      body.appendChild(r);
    });
    const hrs=24-new Date().getHours();
    sec(t('qDaily')+' · '+t('qReset')(hrs));
    t('daily').forEach((q,i)=>{
      const pr=Math.min(S.daily.p[i]||0,DAILY_GOAL[i]),done=dailyDone(i),got=S.daily.c[i];
      const rw=DAILY_REWARD[i];
      const r=document.createElement('div');r.className='row'+(got?' done':'');
      r.innerHTML=`<div class="ri">${got?'✅':DAILY_IC[i]}</div><div class="rt">
        <div class="rn">${q}</div>
        <div class="rd">${pr} / ${DAILY_GOAL[i]} · ${rw.g?'💎 '+rw.g:'🪙 '+rw.c}
        <div class="mini"><i style="width:${pr/DAILY_GOAL[i]*100}%"></i></div></div></div>`;
      if(done&&!got){const b=document.createElement('button');b.className='btn o sm';b.textContent=t('claim');
        b.onclick=()=>{S.daily.c[i]=1;if(rw.c)S.coins+=rw.c;if(rw.g)S.gems+=rw.g;save();renderAll();};
        r.appendChild(b);}
      body.appendChild(r);
    });
    sec(t('qAch'));
    ACH.forEach(a=>{
      const locked=S.lv<a.lv, tier=achTier(a), got=achClaimed(a);
      const maxed=got>=a.steps.length;
      const goal=a.steps[Math.min(got,a.steps.length-1)];
      // 진행도를 목표에 맞춰 자른다. 안 그러면 num()이 한쪽만 축약해
      // '100.0k / 1,000'처럼 진행도가 목표보다 작아 보인다 (일일 퀘스트는 이미 자르고 있다)
      const vRaw=statVal(a.st), v=Math.min(vRaw, a.steps[Math.min(got,a.steps.length-1)]);
      const r=document.createElement('div');r.className='row'+(maxed?' done':'');
      const prog=Math.min(100, v/goal*100);
      r.innerHTML=`<div class="ri">${locked?'🔒':a.ic}</div><div class="rt">
        <div class="rn">${t('ach')[a.id]}${maxed?'':` <span style="color:var(--dim);font-weight:700">${Math.min(got+1,a.steps.length)}/${a.steps.length}</span>`}</div>
        <div class="rd">${locked?t('achLv')(a.lv):(maxed?t('claimed'):`${num(v)} / ${num(goal)} · ${a.rw[got].g?'💎 '+a.rw[got].g:'🪙 '+a.rw[got].c}${a.rw[got].o?' + 🎁'+t('objs')[a.rw[got].o]:''}
        <div class="mini"><i style="width:${prog}%"></i></div>`)}</div></div>`;
      if(!locked&&!maxed&&tier>got){
        const b=document.createElement('button');b.className='btn o sm';b.textContent=t('claim');
        b.onclick=()=>{const rw=a.rw[got];if(rw.c)S.coins+=rw.c;if(rw.g)S.gems+=rw.g;if(rw.o)grantObj(rw.o);
          S.ach[a.id]=got+1;save();renderAll();toast(t('claim')+' ✓');};
        r.appendChild(b);
      }
      body.appendChild(r);
    });
    sec(t('qLv'));
    for(let l=S.lvClaim;l<=Math.min(MAX_LV,Math.max(S.lv,S.lvClaim)+2);l++){
      const can=S.lv>=l&&l>=S.lvClaim, rw=lvReward(l);
      const ic=rw.uniq?'🏆':(l%50===0?'👑':(l%10===0?'🎊':(l%5===0?'🎀':'🎁')));
      const r=document.createElement('div');r.className='row'+(rw.uniq?' done':'');
      r.innerHTML=`<div class="ri">${can?ic:'🔒'}</div><div class="rt">
        <div class="rn">Lv.${l}${rw.uniq?' · '+t('uniqPick'):''}</div>
        <div class="rd">🪙 ${num(rw.c)}${rw.g?' · 💎 '+rw.g:''}${rw.uniq?' · '+t('uniqRw'):''}</div></div>`;
      if(can){const b=document.createElement('button');b.className='btn o sm';b.textContent=t('claim');
        b.onclick=()=>{S.coins+=rw.c;S.gems+=(rw.g||0);S.lvClaim=l+1;save();
          if(rw.uniq)showUniqPick();else renderAll();};r.appendChild(b);}
      body.appendChild(r);
    }
  }
  $('coins').textContent=num(S.coins); $('gems').textContent=num(S.gems);
}
// 광고 카드와 같은 결로 만든다 — 상점에서 튀지 않게
function kofiCard(){
  if(!KOFI_ID) return null;
  const el=document.createElement('div'); el.className='adcard kofi';
  el.innerHTML=`<div class="ai">☕</div><div class="at">
    <div class="an">${t('kofiT')}</div><div class="ad2">${t('kofiD')}</div></div>`;
  const b=document.createElement('button'); b.textContent=t('kofiB');
  b.onclick=()=>window.open(KOFI_URL(),'_blank','noopener');
  el.appendChild(b); return el;
}
function adCard(kind){
  const el=document.createElement('div');el.className='adcard';
  const cd=kind==='coin'?300e3:600e3, left=cd-(Date.now()-(S.adcd[kind]||0));
  el.innerHTML=`<div class="ai">🎬</div><div class="at">
    <div class="an">${t(kind==='coin'?'adCoin':'adFeed')}</div>
    <div class="ad2">${t(kind==='coin'?'adCoinD':'adFeedD')}</div></div>`;
  const b=document.createElement('button');
  if(left>0){b.textContent=t('cool')(fmt(left));b.disabled=true;}
  else{b.textContent=t('watch');b.onclick=()=>watchAd(kind);}
  el.appendChild(b);return el;
}
function renderPick(){
  const cap=slots();
  [0,1].forEach(i=>{const el=$('p'+i),id=S.pick[i];
    if(i>=cap){ el.className='slotpick lock'; el.innerHTML='🔒';
      el.onclick=()=>toast(t('slotLocked')(SLOT_UNLOCK)); return; }
    if(id){const f=foodDef(id);el.className='slotpick has';
      el.innerHTML=f.poop?`<img class="pfimg" src="${thumb(f.sp)}" alt="">`:f.ic;}
    else{el.className='slotpick';el.innerHTML='+';}
    el.onclick=()=>{ if(S.pick[i]!==undefined){S.pick.splice(i,1);renderPanel();renderPick();} };});
  const c=S.pens[S.sel], ready=!!(S.open[S.sel]&&c&&!c.feed);
  $('go').disabled=S.pick.length<1||!ready;
  $('go').textContent = !c ? t('needParent')
    // '먹이 주기 → 앵무새똥'은 결과가 앵무새똥이라는 뜻으로 읽혔다.
    // 어느 똥인지는 위 칸 표시가 이미 말해주니 버튼에서는 뺀다.
    : (c.feed ? t('busyDigest') : (S.pick.length<1?t('goPick'):t('go')));
}
function renderHud(){
  $('lv').textContent='Lv.'+S.lv+(S.lv>=MAX_LV?' MAX':'');
  $('xpbar').style.width=(S.exp/needXp(S.lv)*100)+'%';
  $('coins').textContent=num(S.coins);$('gems').textContent=num(S.gems);
}
function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.classList.toggle('on',b.dataset.tab===TAB);
    b.classList.toggle('alert', b.dataset.tab==='quest'&&questAlert());
  });
  document.querySelectorAll('[data-i]').forEach(el=>{const v=t(el.dataset.i);if(typeof v==='string')el.textContent=v;});
}
function renderAll(){
  document.documentElement.lang=LANG;
  $('lko').classList.toggle('on',LANG==='ko');$('len').classList.toggle('on',LANG==='en');
  const home=TAB==='home';
  $('stage').style.display=home?'':'none';
  $('prev').style.display=home?'':'none';$('next').style.display=home?'':'none';
  const pn=$('panel');
  if(home){ pn.style.flex='0 0 auto'; pn.style.height=''; pn.classList.remove('full'); }
  else { pn.style.flex='1 1 auto'; pn.style.height='0'; pn.classList.add('full'); }
  renderHud();renderTabs();renderSeg();renderPanel();renderPick();if(home)renderStage();
}

/* ════════ 모달 ════════ */
function closeModal(){$('modal').classList.remove('on');}
function showCard(sp,isNew){
  $('mcard').className='card c';
  $('mcard').innerHTML=`<img class="big" src="${img(sp)}" alt="">
    <div><span class="cg" style="background:${GC[sp[4]]}">${t('grades')[sp[4]]}</span></div>
    <h3>${nameOf(sp)}</h3><p class="desc">${(isNew?t('newFound')+'\n':'')+descOf(sp)}</p>`;
  const b=document.createElement('button');b.className='btn';b.style.width='100%';b.textContent=t('ok');
  b.onclick=closeModal;$('mcard').appendChild(b);
  $('modal').classList.add('on');
}
function showUniqPick(){
  const left=UNIQ.filter(n=>!ownUniq().includes(n));
  if(!left.length){renderAll();return;}
  $('mcard').className='card c';
  $('mcard').innerHTML=`<h3 style="margin-top:0">${t('uniqTitle')}</h3>
    <p class="desc">${t('uniqDesc')}</p>`;
  const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:8px;justify-content:center';
  left.forEach(no=>{
    const sp=spOf(no);
    const b=document.createElement('div');
    b.style.cssText='flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 4px;cursor:pointer';
    b.innerHTML=`<img src="${img(sp)}" style="width:100%;max-width:74px;height:74px;object-fit:contain">
      <div style="font-size:11px;font-weight:900;margin-top:3px">${nameOf(sp)}</div>`;
    b.onclick=()=>{ S.uniq=ownUniq().concat([no]); S.found[no]=true; S.inv[no]=(S.inv[no]||0)+1; checkQuests();
      save(); closeModal(); renderAll(); showCard(sp,true); };
    wrap.appendChild(b);
  });
  $('mcard').appendChild(wrap);
  $('modal').classList.add('on');
}
function showDex(sp){
  const have=invCount(sp[0]), g=sp[4], no=sp[0];
  $('mcard').className='card';
  // 이 똥을 얻는 길 — 이미 발견한 조합만 공개
  let how='';
  const src=RECIPE.map((r,i)=>({r,i})).filter(o=>o.r.no===no);
  if(g>=SECRET_GRADE){ how=`<p class="desc" style="text-align:center">🔒 ${t('recipeHide')}</p>`; }
  else if(habitatOf(no)){ how=`<p class="desc" style="text-align:center">🏖️ ${t('habOnly')(t('themes')[habitatOf(no)])}</p>`; }
  else if(src.length){
    const rows=src.map(({r,i})=>{
      const known=!!(S.rcp&&S.rcp[i]);
      const nm=id=>{const f=foodDef(id);return f?(f.poop?nameOf(f.sp):t('foods')[f.id]):'?';};
      return `<tr><td>${known?nameOf(spOf(r.pa))+' + '+r.f.map(nm).join(' + ')
              :'<span class="qmt">'+t('recipeLock')+'</span>'}</td>
              <td class="r">${known?Math.round(effProb(r)*100)+'%':'?'}</td></tr>`;}).join('');
    how=`<table class="tbl"><tr><th>${t('recipe')}</th><th style="text-align:right">${t('chance')}</th></tr>${rows}</table>`
      + (isCraftOnly(no)?`<p class="desc" style="text-align:center;margin-top:6px">🧪 ${t('craftOnly')}</p>`:'');
  } else {
    how=`<p class="desc" style="text-align:center">🌿 ${t('wildOnly')}</p>`;
  }
  $('mcard').innerHTML=`<div style="text-align:center">
      <img class="big" src="${img(sp)}" alt="">
      <div><span class="cg" style="background:${GC[g]}">${t('grades')[g]}</span></div>
      <h3>${nameOf(sp)} <span style="font-size:13px;color:var(--dim)">${t('haveN')(have)}</span></h3>
      <p class="desc">${descOf(sp)}</p></div>${how}`;

  // 똥칸에 배치
  // 칸이 6개면 flex-wrap으로는 줄이 들쭉날쭉해진다. 3열 격자로 고정한다.
  const pw=document.createElement('div');
  pw.className='penpick';
  const lb=document.createElement('div');
  lb.className='rhead'; lb.style.marginTop='12px';
  lb.textContent=t('placeTitle'); $('mcard').appendChild(lb);
  for(let i=0;i<MAX_PENS;i++){
    if(!S.open[i]) continue;
    const cur=S.pens[i];
    const b=document.createElement('button');
    b.className='btn '+(cur?'ghost':'b')+' sm';
    b.innerHTML = cur
      ? `<span class="b1">${i+1}${t('penUnit')}</span><span class="b2">${nameOf(spOf(cur.no))}</span>`
      : `<span class="b1">${i+1}${t('penUnit')}</span><span class="b2">${t('penEmptyShort')}</span>`;
    b.disabled=have<1||!!(cur&&cur.feed);
    b.onclick=()=>placeInPen(no,i);
    pw.appendChild(b);
  }
  $('mcard').appendChild(pw);

  const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:6px;margin-top:8px;flex-wrap:wrap';
  const bf=document.createElement('button');bf.className='btn b sm';bf.style.flex='1';
  bf.textContent=t('toFeed');
  bf.disabled=have<1; bf.onclick=()=>breakDown(no);
  wrap.appendChild(bf);
  const bs=document.createElement('button');bs.className='btn o sm';bs.style.flex='1';
  bs.textContent=`${t('sell')} 🪙${num(SELL[g])}`;
  bs.disabled=have<1; bs.onclick=()=>sellPoop(no,1);
  wrap.appendChild(bs);
  if(have>1){
    const ba=document.createElement('button');ba.className='btn o sm';ba.style.flex='1';
    ba.textContent=`${t('sellAll')(have)} 🪙${num(SELL[g]*have)}`;
    ba.onclick=()=>sellPoop(no,have);
    wrap.appendChild(ba);
  }
  $('mcard').appendChild(wrap);
  const bc=document.createElement('button');bc.className='btn ghost';bc.style.cssText='width:100%;margin-top:8px';
  bc.textContent=t('close');bc.onclick=closeModal;$('mcard').appendChild(bc);
  $('modal').classList.add('on');
}

/* ════════ 루프 ════════ */
setInterval(()=>{
  tickClock();
  if(TAB==='home'){
    const c=S.pens[S.sel];
    if(c&&c.feed){
      const fd=c.feed, left=fd.end-Date.now();
      if(left<=0){ if(!document.querySelector('.poopbtn')) renderStage(); }
      else{ const el=document.querySelector('.pentime[data-end]');
        if(el){const ic=fd.pick.map(id=>{const f=foodDef(id);return f?(f.poop?'💩':f.ic):'';}).join('');
               el.textContent=t('digesting')+' '+ic+' '+fmt(left);}
        const bar=document.querySelector('.penbar>i');
        if(bar)bar.style.width=Math.min(100,(Date.now()-fd.start)/(fd.end-fd.start)*100)+'%'; }
    } else if(!c){
      const el=document.querySelector('.emptyhint span');
      if(el)el.textContent=t('wildIn')(fmt(wildLeft()));
      if(wildLeft()<=0){ wildTick(); save(); renderAll(); }
    }
    if(SEG==='feed'){const rg=document.querySelector('#pbody .regen b'); if(rg)rg.textContent=fmt(regenLeft());}
  }
  if(TAB==='shop'&&SHOPSEG!=='deco')renderPanel();
},1000);
setInterval(save,15000);

/* ════════ 바인딩 ════════ */
$('helpbtn').onclick=()=>{
  $('mcard').className='card';
  $('mcard').innerHTML=`<h3 style="margin-top:0">${t('helpTitle')}</h3><div class="helpbox">${t('help')}</div>`;
  const br=document.createElement('button');br.className='btn ghost sm';br.style.cssText='width:100%;margin-top:4px';
  br.textContent=t('reset');
  br.onclick=()=>{if(confirm(t('resetAsk'))){Store.del(KEY);S=newState();save();closeModal();renderAll();}};
  const bc=document.createElement('button');bc.className='btn';bc.style.cssText='width:100%;margin-top:8px';
  bc.textContent=t('close');bc.onclick=closeModal;
  $('mcard').appendChild(br);$('mcard').appendChild(bc);
  $('modal').classList.add('on');};
$('go').onclick=feedPen;
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
$('lko').onclick=()=>setLang('ko');$('len').onclick=()=>setLang('en');
$('snd').onclick=sndToggle; sndLabel();
function setLang(l){LANG=l;Store.set('poopy_lang',l);renderAll();}  // lang 동기화는 renderAll()이 한다
$('prev').onclick=()=>{S.sel=(S.sel+MAX_PENS-1)%MAX_PENS;save();renderAll();};
$('next').onclick=()=>{S.sel=(S.sel+1)%MAX_PENS;save();renderAll();};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;renderAll();});
document.querySelectorAll('[data-shop]').forEach(el=>el.onclick=()=>{
  TAB='shop';SHOPSEG=el.dataset.shop==='gem'?'gem':'food';renderAll();});

document.addEventListener('error',e=>{const el=e.target;
  if(el&&el.tagName==='IMG'&&el.src.indexOf('data:')!==0){el.src=IMGFB;}},true);
load();checkQuests();renderAll();
// 배경을 바꾸면 jpg를 그때 처음 받느라 몇 초 동안 빈 하늘색이 보인다.
// 첫 화면이 다 그려진 뒤 조용히 나머지를 받아 둔다 (첫 로딩은 방해하지 않는다).
(()=>{const warm=()=>THEMES.forEach(th=>{const i=new Image();i.src='assets/bg/'+th.id+'.webp';});
  if('requestIdleCallback' in window) requestIdleCallback(warm,{timeout:4000});
  else setTimeout(warm,2500);})();
(()=>{let n=0;S.pens.forEach((c,i)=>{if(S.open[i]&&c&&c.feed&&Date.now()>=c.feed.end)n++;});
  if(n>0)setTimeout(()=>toast(t('offline')(n)),600);})();
</script>
